{% extends "base.html" %}

{% block title %}Add Expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record a new expense to keep your dashboard up to date.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('add_expense') }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           step="0.01" min="0.01" placeholder="0.00" required autofocus
                           value="{{ form.amount }}">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if not form.category %} selected{% endif %}>Select a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}"{% if category == form.category %} selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input" required
                           max="{{ max_date }}" value="{{ form.date }}">
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="add-expense-optional">(optional)</span></label>
                    <input type="text" id="description" name="description" class="form-input"
                           maxlength="200" placeholder="e.g. Lunch with a friend"
                           value="{{ form.description }}">
                </div>

                <div class="add-expense-actions">
                    <button type="submit" class="btn-submit">Save expense</button>
                    <a class="btn-ghost" href="{{ url_for('profile') }}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
